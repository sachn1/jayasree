name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history - needed to diff against the previous tag below

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@11

      # One version number covers every npm package, the Python build tool and the site badge, so many
      # tagged releases change nothing npm ships. Skip the publish for those (re-publishing identical
      # contents under a new version is noise); the tag and changelog entry still stand. This applies to
      # tag pushes only: a manual workflow_dispatch run publishes anyway.
      - name: Check whether this release actually changed the npm package
        id: pkg-diff
        if: github.event_name == 'push'
        run: |
          prev_tag=$(git describe --tags --abbrev=0 --exclude="${{ github.ref_name }}" 2>/dev/null || true)
          if [ -z "$prev_tag" ]; then
            echo "No previous tag found - publishing (first release)."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$prev_tag" "${{ github.ref_name }}" -- js/src js/README.md js/LICENSE tools/build_npm_packages.js LICENSE-DATA third-party; then
            echo "js/ unchanged since $prev_tag - skipping npm publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Off until the repository variable NPM_PUBLISH_ENABLED is "true". The engine (js/) and each data
      # package (built into dist-npm/) share one version; a package whose version is already on npm is
      # skipped, so a re-run after a partial failure publishes only what is missing.
      - name: Publish the engine and data packages to npm
        if: >-
          vars.NPM_PUBLISH_ENABLED == 'true' &&
          (github.event_name == 'workflow_dispatch' || steps.pkg-diff.outputs.changed == 'true')
        run: |
          node tools/build_npm_packages.js
          for dir in js dist-npm/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm - skipping."
            else
              (cd "$dir" && npm publish --access public --provenance)
            fi
          done
