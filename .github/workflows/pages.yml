name: Deploy GitHub Pages

# The whole site is static (see docs/CREATING_HANDWRITING.md "Data size & deployment") - the demo
# fetches glyph-data.json / stroke-data.json at runtime and serve.py's only
# dynamic endpoint (/api/shape) is unused by the demo UI. So deployment is
# just: publish a filtered copy of the repo as the Pages artifact.
#
# One-time repo setup: Settings → Pages → Source: "GitHub Actions".

# Runs once per merged PR, after "Release on PR merge" has finished, so the site is built from the final master
# (the version bump included). Triggering on the push to master instead deployed twice: the merge, then the bump.
on:
  workflow_run:
    workflows: ["Release on PR merge"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # A release run that was skipped or cancelled (a PR closed without merging) deploys nothing.
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assemble site
        run: |
          mkdir -p _site
          # Only what the pages reference: the home page, the demo, the runtime + data, the
          # in-browser recorder (three files) and the home page's four example images.
          cp index.html favicon.svg _site/
          mkdir -p _site/js
          cp -r js/src _site/js/
          cp -r demo _site/demo
          mkdir -p _site/tools _site/docs
          cp tools/stroke-recorder.html tools/stroke-recorder.css tools/stroke-recorder.js _site/tools/
          cp -r docs/centering-example _site/docs/
          rm -f _site/demo/serve.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # A separate job, so the artifact is fully stored before the deploy looks for it. In one job the deploy
  # step sometimes ran within a second of the upload and found no artifact.
  deploy:
    needs: build
    # Never run two deploys concurrently; the latest run wins. Set on the job, not the workflow, so a skipped
    # run (the build's `if`) never joins the group and cancels a deploy in flight.
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
