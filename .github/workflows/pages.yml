name: Deploy GitHub Pages

# The whole site is static (see docs/CREATING_HANDWRITING.md "Data size & deployment") - the demo
# fetches glyph-data.json / stroke-data.json at runtime and serve.py's only
# dynamic endpoint (/api/shape) is unused by the demo UI. So deployment is
# just: publish a filtered copy of the repo as the Pages artifact.
#
# One-time repo setup: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys concurrently; latest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble site
        run: |
          mkdir -p _site
          # Only what the pages reference: the home page, the demo, the runtime + data, the
          # in-browser recorder (three files) and the home page's four example images.
          cp index.html favicon.svg _site/
          mkdir -p _site/js
          cp -r js/src _site/js/
          cp -r demo _site/demo
          mkdir -p _site/tools _site/docs
          cp tools/stroke-recorder.html tools/stroke-recorder.css tools/stroke-recorder.js _site/tools/
          cp -r docs/centering-example _site/docs/
          rm -f _site/demo/serve.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
