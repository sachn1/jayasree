<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jayasree - interactive demo</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="stylesheet" href="../js/src/style.css" />
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body>
    <!-- The wordmark. Malayalam's is a pre-exported, self-animating SVG; a
         language whose config has a `logo` entry gets a live one in
         #logo-live instead (see demo.js "Wordmark"). -->
    <img id="logo-stage" src="jayasree.svg" alt="ജയശ്രീ - animated stroke trace of the word Jayasree" />
    <div id="logo-live" role="img" aria-label="Jayasree wordmark, animated" title="Click to replay" hidden></div>

    <!-- One tab per language; demo.js builds them from its LANGUAGES table
         (add a language there, not here). The URL hash (#ml, #hi) selects a
         tab so a language can be linked to directly. -->
    <div id="langTabs" role="tablist" aria-label="Language"></div>

    <p class="tagline" id="tagline"></p>
    <p class="sub" id="sub"></p>

    <form id="traceForm">
      <input id="wordInput" type="text" autocomplete="off" />
      <!-- Hidden by default; demo.js only reveals this if the browser
           actually supports SpeechRecognition - see its "Speech input"
           section. -->
      <button type="button" id="speakBtn" title="Speak a word" aria-label="Speak a word" hidden>
        <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
          <path
            d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <button type="submit" id="traceBtn">Trace</button>
    </form>

    <div class="chips" id="wordChips"></div>

    <!-- Only shown for languages whose config lists `letters`. -->
    <details id="letterBrowser" hidden>
      <summary>Browse letters (for checking individual traces)</summary>
      <div id="letterChips" class="chips"></div>
    </details>

    <!-- Only shown for a language whose config has `fontStrokes` (Malayalam). -->
    <label id="strokeLabel" hidden>
      Strokes
      <select id="strokeCtl">
        <option value="handwriting" selected>Handwriting</option>
        <option value="font">Font-based</option>
      </select>
    </label>
    <p id="strokeNote" hidden></p>
    <p id="strokeCoverage" hidden></p>

    <div id="status"></div>
    <div id="stage"></div>
    <button id="replay" type="button">↺ Replay</button>

    <div id="controls">
      <label>
        Speed
        <input id="speedCtl" type="range" min="0.25" max="3" step="0.25" value="1" />
        <span id="speedVal" class="ctl-val">1×</span>
      </label>
      <label>
        Thickness
        <input id="thicknessCtl" type="range" min="0.010" max="0.050" step="0.004" value="0.022" />
        <span id="thicknessVal" class="ctl-val">medium</span>
      </label>
      <label>
        Repeat
        <select id="countCtl">
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="3">3×</option>
          <option value="5">5×</option>
        </select>
      </label>
    </div>

    <div id="lib-bar">
      <p>Load hand-authored strokes from the recorder:</p>
      <label id="lib-drop">
        Drop <strong>stroke-library.json</strong> here or click to browse
        <input type="file" id="lib-file" accept=".json" style="display: none" />
      </label>
      <p id="lib-status"></p>
    </div>

    <script type="module" src="demo.js"></script>
  </body>
</html>
